<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plate Gate</title>
<style>
:root{--b:#2563eb;--g:#16a34a;--r:#dc2626;--m:#6b7280;--bg:#f5f6f8}
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:var(--bg);color:#111}
nav{background:#111827;padding:10px 16px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
nav a{color:#d1d5db;text-decoration:none;font-size:15px}nav a.on{color:#fff;font-weight:600}nav b{color:#fff;margin-right:12px}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:0 1px 2px #0001}
h2{margin:0 0 12px;font-size:18px}table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 8px;border-bottom:1px solid #eee;text-align:left;vertical-align:middle}
input,select,textarea{padding:7px 9px;border:1px solid #d1d5db;border-radius:6px;font:inherit}
textarea{width:100%}label{display:block;margin:8px 0 3px;font-size:13px;color:#374151}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:4px 16px}
.grid input{width:100%}
button{background:var(--b);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font:inherit}
button.sec{background:#e5e7eb;color:#111}button.red{background:var(--r)}button.sm{padding:4px 9px;font-size:13px}
form.inline{display:inline}.ok{color:var(--g);font-weight:600}.no{color:var(--r);font-weight:600}.mut{color:var(--m);font-size:13px}
.flash{padding:10px 14px;border-radius:8px;margin-bottom:12px;background:#dcfce7;word-break:break-word}.flash.e{background:#fee2e2}
.plate{font-family:ui-monospace,monospace;font-size:16px;font-weight:700;letter-spacing:1px}
img.th{height:54px;border-radius:4px}code{background:#f3f4f6;padding:2px 5px;border-radius:4px;word-break:break-all}
</style></head><body>
<nav><b>🚧 Plate Gate</b>
<a href="/" class="{{'on' if page=='dashboard'}}">События</a>
<a href="/whitelist" class="{{'on' if page=='whitelist'}}">Белый список</a>
<a href="/cameras" class="{{'on' if page=='cameras'}}">Камеры</a>
<a href="/imou" class="{{'on' if page=='imou'}}">Imou / вебхук</a>
<a href="/settings" class="{{'on' if page=='settings'}}">Настройки</a>
</nav><main>
{% if msg %}<div class="flash">{{msg}}</div>{% endif %}
{% if err %}<div class="flash e">{{err}}</div>{% endif %}
{% block body %}{% endblock %}
</main></body></html>
